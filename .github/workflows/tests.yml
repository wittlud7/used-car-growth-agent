name: Test local and hosted agent
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -q
      - run: node --test online/tests/engine.test.mjs
      - run: node --check web/agent.js && node --check web/workflow.js
